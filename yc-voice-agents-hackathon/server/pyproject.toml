[project]
name = "yc-voice-agent-hackathon"
version = "0.1.0"
description = "Voice AI bot built with Pipecat"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[anthropic,gradium,openai,runner,silero,webrtc,websocket]>=1.3.0",
    "pipecatcloud>=0.7.1",
    "tzdata",
    # Daily transport SDK — needed so the bot can answer Pipecat Cloud / Cekura
    # Daily-room sessions (the DailySessionArguments case in bot-claude.py). Linux
    # only: daily-python ships no Windows wheel, and we only run it in the Linux
    # deploy image, never locally.
    "daily-python>=0.28; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "ruff>=0.12.11,<1",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I", "UP"]